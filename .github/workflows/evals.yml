name: Evals

# Path-triggered — this workflow only runs when the copy/reply/optimize brains, the AI client, or
# the evals package itself change, plus a nightly full sweep and manual dispatch. See
# docs/evals.md for the full design (three layers: deterministic + classifier = hard gates, judge
# + pairwise = advisory until the owner's kappa-calibration flips EVALS_JUDGE_GATING=1).
on:
  pull_request:
    paths:
      - "packages/agent-brains/src/copy/**"
      - "packages/agent-brains/src/reply/**"
      - "packages/agent-brains/src/optimize/**"
      - "packages/agent-brains/src/intent/**"
      - "packages/ai/**"
      - "packages/evals/**"
  push:
    branches: [main]
    paths:
      - "packages/agent-brains/src/**"
      - "packages/ai/**"
      - "packages/evals/**"
  schedule:
    # Nightly full sweep at 06:23 UTC — a GITHUB Actions schedule trigger, NOT a Trigger.dev
    # schedule (Trigger's cron scheduler is already at its 10/10 quota, see the prod-ops notes;
    # this cron lives entirely in GitHub Actions and never touches that quota).
    - cron: "23 6 * * *"
  workflow_dispatch:

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Pure-logic layer (mock models, no network) — ALWAYS hard, runs on every trigger including
      # a PR from a fork with no access to secrets. This is the fast, free layer.
      - run: pnpm --filter @vantera/evals test

      # Live evals: real Anthropic calls against the fixture corpus. Cost is bounded to the
      # fixture-set size (currently 36 copy cases + the labeled classifier sets) — roughly
      # $2-5/run at current fixture volume. NOTE: each case is generated ~2x per run (the
      # deterministic gate drafts internally, then judge+pairwise need a second full-corpus
      # generation pass since the gate doesn't expose draft text) — the doubling is the dominant
      # cost driver; factor it into the ~$50-100/mo budget. See docs/evals.md ("Cost") for the
      # single-shared-pass follow-up. The nightly cron is the fuller sweep since every trigger runs
      # the same full suite (there's no separate "quick" mode). API-key-gated: absent secret is a
      # LOUD skip (a visible ::warning), never a silent green — see docs/evals.md.
      - name: Live evals (API-gated)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY not set — live evals (deterministic gate, classifier floors, judge, pairwise) SKIPPED. GATE 1 requires them; add the secret to unlock."
            exit 0
          fi
          pnpm --filter @vantera/evals evals:ci

  # Judge calibration labeling packet (Phase 2C, Task 1 — "the unblocker"). workflow_dispatch ONLY:
  # this is the owner's on-demand tool to generate a fresh ~100-draft packet for a labeling
  # session, never something that should run on every push/PR/nightly sweep like the `evals` job
  # above. API-key-gated with the same loud-skip contract (see `packages/evals/src/calibration-prep.ts`'s
  # `main()`, which reuses `ci.ts`'s `shouldSkipLiveEvals`). See docs/evals.md for the full
  # calibration procedure (download the artifact, fill humanOverall, run evals:calibration-score).
  calibration-prep:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build calibration packet (API-gated)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY not set — calibration packet build SKIPPED. Add the secret to run the owner labeling session (WS-2.3)."
            exit 0
          fi
          pnpm --filter @vantera/evals evals:calibration-prep

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: calibration-packet
          path: packages/evals/fixtures/judge-calibration/packet.json
          if-no-files-found: warn
