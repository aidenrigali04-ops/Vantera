name: Deploy to Trigger.dev (prod)

# Rides the same gate as everything else (rule 10): only deploys after the CI
# workflow (lint / type-check / test / build) succeeds on main — never on a red build.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # trigger.config.ts lives in packages/jobs; deploy targets the prod environment by default.
      - name: Deploy Trigger.dev tasks (prod)
        working-directory: packages/jobs
        run: npx trigger.dev@latest deploy
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
