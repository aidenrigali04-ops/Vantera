name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build

  # Dependency vulnerability scan (production-readiness, rule 10). CRITICAL advisories fail the
  # build; HIGH is report-only so a freshly disclosed high never blocks an unrelated deploy
  # (Dependabot's PR queue handles remediation).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fail on critical advisories
        run: pnpm audit --audit-level=critical
      - name: Report high advisories (non-blocking)
        run: pnpm audit --audit-level=high || true
