<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vantera — Auth Panel</title>
<style>
  :root{
    --stage:#e7ecf3;
    --ink:#0a0c12;
    --ink-2:#3a3f48;
    --ink-3:#5e636c;
    --ink-4:#9aa0a8;
    --blue:#1877f2;
    --blue-deep:#0b57ab;
    --amber:#e8850e;
    --won:#0f9d58;
    --card:#ffffff;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",system-ui,"Segoe UI",sans-serif;
    --mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,"Roboto Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:var(--font);background:var(--stage);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;color:var(--ink);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }

  /* ===== Light premium stage ===== */
  .panel{
    position:relative;overflow:hidden;
    aspect-ratio:9/16;height:min(94vh,860px);width:auto;
    background:radial-gradient(120% 85% at 50% 30%, #f8fafe 0%, #eef2f9 60%, #e6ecf5 100%);
    border-radius:26px;
    box-shadow:0 40px 90px -44px rgba(20,32,60,.30), 0 2px 10px rgba(20,32,60,.06), inset 0 0 0 1px rgba(12,16,26,.05);
    isolation:isolate;
  }
  .panel::after{content:"";position:absolute;inset:0;z-index:7;pointer-events:none;
    background:linear-gradient(180deg, rgba(12,16,26,.035) 0%, rgba(12,16,26,0) 13%, rgba(12,16,26,0) 87%, rgba(12,16,26,.045) 100%)}

  /* the living signature glow — a soft colored halo behind the card */
  .glow{position:absolute;left:50%;top:48%;width:92%;height:56%;transform:translate(-50%,-50%);
    z-index:0;pointer-events:none;border-radius:50%;
    background:radial-gradient(circle at 50% 50%, rgba(24,119,242,.22) 0%, rgba(24,119,242,0) 60%);
    filter:blur(34px);opacity:0;transition:opacity 1.6s ease, background 1.4s ease;
    animation:breathe 7s ease-in-out infinite alternate}
  .panel.subject .glow{opacity:.55}
  .panel.lit .glow{opacity:.72}
  .panel.won .glow{background:radial-gradient(circle at 50% 50%, rgba(15,157,88,.22) 0%, rgba(15,157,88,0) 60%)}
  @keyframes breathe{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-51%) scale(1.05)}}

  .grain{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.35;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.035'/></svg>");}

  /* the market noise — the card is drawn from it, then it falls away */
  .field{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1.4s ease}
  .panel.market .field{opacity:1}
  .panel.focused .field{opacity:0}
  .nd{position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(12,16,26,.17);
    transform:translate(-50%,-50%);animation:twinkle 4s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.28}50%{opacity:.6}}

  /* ===== Camera ===== */
  .cam{position:absolute;inset:0;z-index:4;transform-origin:50% 50%;will-change:transform;backface-visibility:hidden}

  /* ===== The card — a clean, substantial white surface ===== */
  .card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.965);width:80%;
    padding:22px 24px 26px;border-radius:22px;text-align:center;
    background:var(--card);
    border:1px solid rgba(12,16,26,.08);
    box-shadow:0 1px 2px rgba(20,32,60,.05), 0 26px 54px -26px rgba(20,32,60,.22), 0 8px 18px -14px rgba(20,32,60,.12), inset 0 1px 0 rgba(255,255,255,.7);
    opacity:0;transition:opacity .9s ease, transform .9s cubic-bezier(.16,1,.3,1), border-color .8s ease, box-shadow .8s ease}
  .panel.subject .card{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .panel.won .card{border-color:rgba(15,157,88,.30);
    box-shadow:0 1px 2px rgba(15,90,55,.06), 0 26px 60px -26px rgba(15,157,88,.24), 0 0 42px -14px rgba(15,157,88,.22), inset 0 1px 0 rgba(255,255,255,.7)}

  /* status pill — the glanceable progression */
  .status{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.11em;
    text-transform:uppercase;padding:5px 11px;border-radius:999px;color:var(--ink-3);
    background:rgba(12,16,26,.045);border:1px solid rgba(12,16,26,.08);
    transition:color .5s ease, background .5s ease, border-color .5s ease}
  .status .sd{width:5px;height:5px;border-radius:50%;background:var(--blue);box-shadow:0 0 6px rgba(24,119,242,.55);transition:background .5s,box-shadow .5s}
  .status.amber{color:#b06908}.status.amber .sd{background:var(--amber);box-shadow:0 0 6px rgba(232,133,14,.55)}
  .status.won{color:#0b7a46;background:rgba(15,157,88,.10);border-color:rgba(15,157,88,.26)}
  .status.won .sd{background:var(--won);box-shadow:0 0 7px rgba(15,157,88,.6)}

  /* the persistent signal orb */
  .signal{width:12px;height:12px;border-radius:50%;position:relative;margin:18px auto 14px;
    background:var(--blue);box-shadow:0 0 14px 1px rgba(24,119,242,.4);
    transition:background .7s ease, box-shadow .7s ease}
  .signal::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(24,119,242,.5);opacity:0}
  .signal[data-phase="intent"]::before{animation:pulse 1.9s ease-out infinite}
  .signal[data-phase="warm"]{background:var(--amber);box-shadow:0 0 16px 2px rgba(232,133,14,.45)}
  .signal[data-phase="warm"]::before{border-color:rgba(232,133,14,.5);animation:pulse 1.4s ease-out infinite}
  .signal[data-phase="won"]{background:var(--won);box-shadow:0 0 22px 3px rgba(15,157,88,.5)}
  .signal[data-phase="won"]::before{border-color:rgba(15,157,88,.5);animation:pulseWon 1.6s ease-out 1}
  @keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.5);opacity:0}}
  @keyframes pulseWon{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.6);opacity:0}}

  /* identity */
  .who .nm{font-size:15.5px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
  .who .rl{font-size:12.5px;font-weight:450;color:var(--ink-3);margin-top:3px}

  /* hairline divider */
  .rule{height:1px;margin:16px -24px 0;background:linear-gradient(90deg,rgba(12,16,26,0),rgba(12,16,26,.09) 20%,rgba(12,16,26,.09) 80%,rgba(12,16,26,0))}

  /* the transforming body */
  .body{min-height:92px;margin-top:16px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .body .cnt{opacity:0;transform:translateY(6px);transition:opacity .55s cubic-bezier(.16,1,.3,1), transform .55s cubic-bezier(.16,1,.3,1);width:100%}
  .body.show .cnt{opacity:1;transform:none}
  .line{font-size:16px;font-weight:450;letter-spacing:-.01em;color:var(--ink-2);line-height:1.45}
  .line.quote{font-style:italic;color:var(--ink);font-size:15.5px;max-width:28ch;margin:0 auto}
  .attr{display:block;font-size:11px;font-weight:500;color:var(--ink-3);margin-bottom:13px;letter-spacing:.01em}
  .attr .who{color:var(--ink-2);font-weight:600}
  .attr .ar{color:var(--blue);font-weight:700;margin:0 5px}
  .attr .ctx{color:var(--ink-4)}
  .bigval{font-family:var(--mono);font-size:41px;font-weight:600;letter-spacing:-.025em;color:var(--ink);
    font-variant-numeric:tabular-nums;line-height:1}
  .pipe{margin-top:14px;font-size:12.5px;font-weight:500;color:var(--ink-3)}
  .pipe b{color:var(--ink-2);font-weight:600}
  .pipe .ar{color:var(--won);font-weight:700;margin-right:4px}

  /* quiet brand grounding */
  .mark{position:absolute;left:0;right:0;bottom:26px;z-index:6;text-align:center;
    font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-4);
    opacity:0;transition:opacity 1.2s ease}
  .panel.subject .mark{opacity:1}

  @media (prefers-reduced-motion: reduce){
    .glow,.signal,.nd{animation:none!important}
    .cam{transform:none!important}
    .card,.body .cnt,.glow,.field,.mark,.status,.signal{transition-duration:.001s!important}
  }
</style>
</head>
<body>
  <div class="panel" id="panel">
    <div class="glow"></div>
    <div class="grain"></div>

    <div class="field" id="field">
      <span class="nd" style="left:20%;top:20%;animation-delay:.2s"></span>
      <span class="nd" style="left:78%;top:16%;animation-delay:1.1s"></span>
      <span class="nd" style="left:40%;top:12%;animation-delay:.6s"></span>
      <span class="nd" style="left:88%;top:34%;animation-delay:1.7s"></span>
      <span class="nd" style="left:12%;top:40%;animation-delay:.9s"></span>
      <span class="nd" style="left:70%;top:70%;animation-delay:2.1s"></span>
      <span class="nd" style="left:24%;top:74%;animation-delay:1.4s"></span>
      <span class="nd" style="left:86%;top:78%;animation-delay:.4s"></span>
      <span class="nd" style="left:14%;top:66%;animation-delay:2.4s"></span>
      <span class="nd" style="left:58%;top:84%;animation-delay:1.0s"></span>
      <span class="nd" style="left:33%;top:86%;animation-delay:1.9s"></span>
      <span class="nd" style="left:90%;top:56%;animation-delay:.7s"></span>
    </div>

    <div class="cam" id="cam">
      <div class="card" id="card">
        <div class="status" id="status"><span class="sd"></span><span id="statusText">In&#8209;market</span></div>
        <div class="signal" id="signal"></div>
        <div class="who">
          <div class="nm">Sarah Chen</div>
          <div class="rl">VP Sales · Northwind</div>
        </div>
        <div class="rule"></div>
        <div class="body" id="body"><div class="cnt" id="cnt"></div></div>
      </div>
    </div>

    <div class="mark">Vantera</div>
  </div>

<script>
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var panel  = document.getElementById('panel');
  var cam    = document.getElementById('cam');
  var signal = document.getElementById('signal');
  var body   = document.getElementById('body');
  var cnt    = document.getElementById('cnt');
  var status = document.getElementById('status');
  var statusText = document.getElementById('statusText');

  var STATES = [
    {t:0,     fn:function(){ reset(); panel.classList.add('market'); }},
    {t:1500,  fn:function(){ panel.classList.add('subject'); signal.setAttribute('data-phase','intent');
                             setStatus('In‑market',''); setBody('<span class="line">Real intent — she’s publicly talking about what you do.</span>'); }},
    {t:5400,  fn:function(){ panel.classList.remove('market'); panel.classList.add('focused','lit'); signal.setAttribute('data-phase','steady');
                             setStatus('Qualified',''); setBody('<span class="line">She clears your bar — real intent, real match.</span>'); }},
    {t:9200,  fn:function(){ setStatus('Reaching out','');
                             setBody('<span class="attr"><span class="who">You</span><span class="ar">→</span><span class="who">Sarah</span> <span class="ctx">· written from her post</span></span><span class="line quote">“Your point about forecasting after the raise stuck with me.”</span>'); }},
    {t:13200, fn:function(){ signal.setAttribute('data-phase','warm'); setStatus('Replied','amber');
                             setBody('<span class="attr"><span class="who">Sarah</span><span class="ar">→</span><span class="who">you</span> <span class="ctx">· replied within the hour</span></span><span class="line quote">“This is timely — send a bit more this week.”</span>'); }},
    {t:16600, fn:function(){ payoff(); }},
    {t:22400, fn:function(){ body.classList.remove('show'); dissolve(); }}
  ];
  var LOOP = 25200;

  var timers=[];
  function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
  function later(ms,fn){ timers.push(setTimeout(fn,ms)); }

  function reset(){
    clearTimers();
    panel.className='panel';
    signal.removeAttribute('data-phase');
    body.classList.remove('show'); cnt.innerHTML='';
    setStatus('In‑market','');
  }
  function setStatus(txt,cls){ statusText.textContent=txt; status.className='status'+(cls?' '+cls:''); }
  function setBody(html,done){
    body.classList.remove('show');
    later(reduce?0:260, function(){ cnt.innerHTML=html; void cnt.offsetWidth; body.classList.add('show'); if(done)done(); });
  }
  function dissolve(){ panel.classList.remove('subject','focused','lit','won'); panel.classList.add('market'); }

  function fmt(n){ return '$'+Math.round(n).toLocaleString('en-US'); }
  function countUp(el,to,dur){
    if(!el) return;
    if(reduce){ el.textContent=fmt(to); return; }
    var s=null;
    function step(now){ if(s===null)s=now; var p=Math.max(0,Math.min(1,(now-s)/dur)); el.textContent=fmt(to*(1-Math.pow(1-p,3))); if(p<1)requestAnimationFrame(step); }
    requestAnimationFrame(step);
  }
  function payoff(){
    signal.setAttribute('data-phase','won');
    panel.classList.add('won');
    setStatus('Closed–won','won');
    setBody('<div class="bigval" id="bv">$0</div><div class="pipe"><span class="ar">→</span> Pushed to <b>your pipeline</b></div>',
            function(){ later(reduce?0:60, function(){ countUp(document.getElementById('bv'),48000,1300); }); });
  }

  /* Camera — one slow motivated draw-in that decelerates and HOLDS at the payoff. */
  function camScaleAt(t){
    if(t<16600) return 1.0 + 0.045*(1-Math.pow(1-t/16600,2.2));
    if(t<18400) return 1.045 + 0.03*(1-Math.pow(1-(t-16600)/1800,2));
    if(t<22400) return 1.075;
    return 1.075 - 0.075*Math.min(1,(t-22400)/(LOOP-22400));
  }

  var idx=-1, start=null, last=null, camS=1.0;
  function loop(now){
    if(start===null){ start=now; last=now; }
    var dt=Math.min(64, now-last); last=now;
    var t=(now-start)%LOOP;
    var cur=0; for(var i=STATES.length-1;i>=0;i--){ if(t>=STATES[i].t){ cur=i; break; } }
    if(cur!==idx){ idx=cur; STATES[cur].fn(); }
    if(!reduce){
      var target=camScaleAt(t);
      var a=1-Math.exp(-dt/120);
      camS+=(target-camS)*a;
      var drift=Math.sin(t/6200)*0.12;
      cam.style.transform='translateY('+drift.toFixed(2)+'%) scale('+camS.toFixed(4)+')';
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
